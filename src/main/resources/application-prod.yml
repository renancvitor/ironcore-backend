spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  health:
    mongo:
      enabled: false

security:
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN:https://irconcore.com.br}
  cookie:
    same-site: Lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

messaging:
    provider: none
    kafka:
      enabled: false

outbox:
   scheduler:
     enabled: false
